  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#ep02-titleGrad)">路由的约定之力</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Nuxt 4 实战漫画剧场 · NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#ep02-titleGrad)" opacity="0.6"/>
  <g transform="translate(20,84)">
