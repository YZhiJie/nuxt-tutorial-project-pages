    <text x="102" y="95" font-size="15" fill="#0b1220">Vue 单页应用要做 SEO，</text>
    <text x="102" y="117" font-size="15" fill="#0b1220">路由、SSR、元信息全手写，</text>
    <text x="102" y="139" font-size="15" fill="#0b1220">上线前夜还在调水合！</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 纯 Vue 项目的隐痛</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">router 手搓 × SEO 没有</text>
    <text x="38" y="210" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">SSR 接 vite-plugin 半残</text>
    <text x="38" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 基础设施吃掉一半工时</text>
    <text x="38" y="246" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 业务反而没空写</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">页面能跑，但地基全是临时板房。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">每个项目都重复发明同一批轮子。</text>
  </g>
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
