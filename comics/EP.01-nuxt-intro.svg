<g transform="translate(52,110)"><rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/><circle cx="0" cy="-2" r="16" fill="#ffd9b3"/><path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/><circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/><circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/><path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/><circle cx="-5" cy="0" r="1.4" fill="#0b1220"/><circle cx="5" cy="0" r="1.4" fill="#0b1220"/><path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/></g>
