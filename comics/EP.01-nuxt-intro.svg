    <text x="102" y="117" font-size="15" fill="#0b1220">开发服务器直接起，</text>
    <text x="102" y="139" font-size="15" fill="#0b1220">这就是开箱即用？</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">npm create nuxt my-app</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">cd my-app &amp;&amp; npm install</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">npm run dev</text>
    <text x="38" y="228" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// → http://localhost:3000</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// DevTools 面板随项目自带</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">create-nuxt 生成最小骨架，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">nuxi 是 Nuxt 的官方 CLI 入口。</text>
