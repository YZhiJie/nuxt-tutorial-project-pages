    <rect x="88" y="73" width="214" height="74" rx="10" fill="#f8fafc"/>
    <text x="102" y="95" font-size="15" fill="#0b1220">Nuxt 是 Vue 的上层框架：</text>
    <text x="102" y="117" font-size="15" fill="#0b1220">路由、SSR、数据获取</text>
    <text x="102" y="139" font-size="15" fill="#0b1220">全部按约定自动装配。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">app/pages/   → 自动路由</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">app/components/ → 自动导入</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">server/api/  → 后端接口</text>
    <text x="38" y="228" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 约定优于配置</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 目录即架构</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">Nuxt 4 基于 Vue 3 + Vite + Nitro，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">一套代码覆盖前端与服务端。</text>
  </g>
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
